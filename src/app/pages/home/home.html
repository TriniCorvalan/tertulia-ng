<section class="row g-3">
  <div class="col-12">
    <h1 class="h2 mb-2">Tertulia</h1>
    <p class="text-secondary">
      Categorías del foro cargadas desde ms-foro.
    </p>
  </div>

  @if (loading()) {
    <div class="col-12">
      <p class="text-secondary mb-0">Cargando categorías…</p>
    </div>
  } @else if (error()) {
    <div class="col-12">
      <div class="alert alert-warning mb-0" role="alert">{{ error() }}</div>
    </div>
  } @else {
    @for (cat of categorias(); track cat.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <a class="card h-100 text-decoration-none text-body" [routerLink]="['/categorias', cat.id]">
          <div class="card-body">
            <h2 class="h5 card-title">{{ cat.nombre }}</h2>
            <p class="card-text text-secondary mb-0">{{ cat.descripcion }}</p>
          </div>
        </a>
      </div>
    } @empty {
      <div class="col-12">
        <p class="text-secondary mb-0">No hay categorías todavía.</p>
      </div>
    }
  }
</section>
