<header class="border-bottom bg-white">
  <nav class="navbar navbar-expand-lg container">
    <a class="navbar-brand fw-semibold" routerLink="/inicio">Tertulia</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#tertuliaNav"
      aria-controls="tertuliaNav"
      aria-expanded="false"
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="tertuliaNav">
      <ul class="navbar-nav ms-auto gap-lg-2 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/inicio" routerLinkActive="active">Inicio</a>
        </li>
        @if (auth.isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/temas/nuevo" routerLinkActive="active">Publicar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/perfil" routerLinkActive="active">Perfil</a>
          </li>
          @if (auth.isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin/moderacion" routerLinkActive="active"
                >Moderación</a
              >
            </li>
          }
          <li class="nav-item">
            <span class="navbar-text small text-secondary me-2">{{
              auth.currentUser()?.nombre
            }}</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-secondary btn-sm" type="button" (click)="logout()">
              Salir
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/registro" routerLinkActive="active">Registro</a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
