AWSTemplateFormatVersion: '2010-09-09'
Description: Tertulia EC2 host (3 MS + Angular). Reuses an existing Oracle wallet S3 bucket.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains the selected public subnet.
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with a route to an Internet Gateway.
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
    Description: Prefer t3.large for three Spring Boot JVMs plus the frontend.
  InstanceImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI parameter.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: IPv4 CIDR allowed to reach the demo over HTTP; restrict this where possible.
  CreateInstanceRole:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: Set true outside AWS Academy to create a least-privilege EC2 role and instance profile.
  ExistingInstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Existing instance profile when CreateInstanceRole is false (AWS Academy default).
  OracleCredentialsSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Secret JSON with DB_URL, DB_USERNAME, DB_PASSWORD for FORO_APP (optional JWT_SECRET).
  OracleWalletBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Existing private wallet bucket (reuse the library bucket; this stack does not create one).
  OracleWalletObjectKey:
    Type: String
    AllowedPattern: '^[A-Za-z0-9._/-]{1,1024}$'
    Description: S3 object key for the Oracle wallet ZIP.

Conditions:
  CreateEc2Role: !Equals [!Ref CreateInstanceRole, 'true']

Resources:
  TertuliaAppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP for Tertulia; administration is through Systems Manager.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Public demo HTTP; restrict AllowedHttpCidr when possible.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TertuliaAppRole:
    Type: AWS::IAM::Role
    Condition: CreateEc2Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: TertuliaAppRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PullTertuliaImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/ms-usuarios
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/ms-foro
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/ms-moderacion
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tertulia-ng
              - Sid: ReadOracleCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OracleCredentialsSecretArn
              - Sid: ReadOracleWallet
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${OracleWalletBucketName}/${OracleWalletObjectKey}

  TertuliaAppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateEc2Role
    Properties:
      Roles:
        - !Ref TertuliaAppRole

  TertuliaAppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref InstanceImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !If
        - CreateEc2Role
        - !Ref TertuliaAppInstanceProfile
        - !Ref ExistingInstanceProfileName
      NetworkInterfaces:
        - SubnetId: !Ref PublicSubnetId
          DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          GroupSet:
            - !Ref TertuliaAppSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker nginx
          command -v aws
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
          rm -f /etc/nginx/conf.d/default.conf
          cat > /etc/nginx/conf.d/tertulia.conf <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;

              location /auth/ {
                  proxy_pass http://127.0.0.1:8081/auth/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /usuarios/ {
                  proxy_pass http://127.0.0.1:8081/usuarios/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:8082/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /moderacion/ {
                  proxy_pass http://127.0.0.1:8083/moderacion/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  proxy_pass http://127.0.0.1:4000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}
        - Key: Application
          Value: tertulia
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  InstanceId:
    Description: EC2 instance id for SSM deploys.
    Value: !Ref TertuliaAppInstance
  PublicIp:
    Description: Public HTTP address; the instance does not have a fixed IP.
    Value: !GetAtt TertuliaAppInstance.PublicIp
  WebsiteUrl:
    Description: Tertulia frontend URL (HTTP).
    Value: !Sub http://${TertuliaAppInstance.PublicIp}/
  WalletBucketName:
    Description: Existing wallet bucket (passed through).
    Value: !Ref OracleWalletBucketName
  WalletObjectKey:
    Description: Wallet object key.
    Value: !Ref OracleWalletObjectKey
  InstanceProfileName:
    Description: Instance profile used by the EC2 host.
    Value: !If
      - CreateEc2Role
      - !Ref TertuliaAppInstanceProfile
      - !Ref ExistingInstanceProfileName
